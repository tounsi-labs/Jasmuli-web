<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Jasmuli</title>
<style>
  :root { color-scheme: light; }
  body { margin:0; background:#f7f7f7; font-family:Arial,Helvetica,sans-serif; color:#333; }
  .wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:30px 16px; box-sizing:border-box; }
  .card { width:100%; max-width:560px; background:#fff; border-radius:12px; padding:30px 25px; text-align:center; box-sizing:border-box; }
  .card img { display:block; width:150px; max-width:100%; height:auto; margin:0 auto 30px; border:0; }
  h1 { color:#b91515; font-size:24px; line-height:1.3; margin:0 0 20px; }
  p { font-size:15px; line-height:1.7; margin:0 0 15px; }
  .muted { font-size:13px; color:#666; }
  a { color:#b91515; }
</style>
</head>
<body>
<div class="wrap">
  <main class="card">
    <img src="https://nauipqcafyjovvwbiayv.supabase.co/storage/v1/object/public/Logo-Jasmuli/logo-jasmuli.png" alt="Jasmuli - Apprendre l'arabe tunisien" width="150">
    <h1 id="title">Jasmuli</h1>
    <p id="text">Apprendre l'arabe tunisien.</p>
    <p class="muted">Une question ? Écrivez-nous à <a href="mailto:contact@jasmuli.fr">contact@jasmuli.fr</a>.</p>
  </main>
</div>
<script>
(function () {
  var raw = (location.search + '&' + location.hash.replace(/^#/, '')).replace(/^[?&]+/, '');
  var p = new URLSearchParams(raw);
  var title = document.getElementById('title');
  var text = document.getElementById('text');
  if (p.has('error') || p.has('error_code')) {
    title.textContent = 'Lien expiré ou déjà utilisé';
    text.textContent = "Ce lien n'est plus valable. Ouvrez l'application Jasmuli et essayez de vous connecter : si votre adresse est déjà confirmée, cela fonctionnera.";
  } else if (p.has('code') || p.has('access_token')) {
    title.textContent = 'Adresse e-mail confirmée';
    text.textContent = "Merci ! Vous pouvez maintenant ouvrir l'application Jasmuli et vous connecter.";
  }
  if (location.search || location.hash) {
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
  }
})();
</script>
</body>
</html>
